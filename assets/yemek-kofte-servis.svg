<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300" role="img" aria-label="Köfte servis — el yapımı ızgara köfteler, lavaş yatağında közlenmiş domates biber ve sumaklı soğanla">
<defs>
  <radialGradient id="koBg" cx="50%" cy="38%" r="75%">
    <stop offset="0" stop-color="#3b2517"/><stop offset=".55" stop-color="#241a13"/><stop offset="1" stop-color="#13100d"/>
  </radialGradient>
  <radialGradient id="koGlow" cx="50%" cy="46%" r="52%">
    <stop offset="0" stop-color="#ff7d1e" stop-opacity=".3"/><stop offset="1" stop-color="#ff7d1e" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="koLav" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#f7e8c1"/><stop offset=".6" stop-color="#e2c692"/><stop offset="1" stop-color="#b28f5b"/>
  </linearGradient>
  <linearGradient id="koMeat" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#b07747"/><stop offset=".45" stop-color="#7f4d29"/><stop offset="1" stop-color="#452612"/>
  </linearGradient>
  <linearGradient id="koPep" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#8cbb45"/><stop offset="1" stop-color="#3c6520"/>
  </linearGradient>
  <linearGradient id="koTom" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#e0512c"/><stop offset="1" stop-color="#8d1e10"/>
  </linearGradient>
  <filter id="koSoft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="3.5"/></filter>
  <filter id="koBlur" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="1.3"/></filter>
</defs>

<rect width="400" height="300" fill="url(#koBg)"/>
<ellipse cx="200" cy="150" rx="190" ry="140" fill="url(#koGlow)"/>
<ellipse cx="200" cy="256" rx="156" ry="30" fill="#0b0806" opacity=".8" filter="url(#koSoft)"/>

<ellipse cx="200" cy="200" rx="154" ry="66" fill="#1a1715"/>
<ellipse cx="200" cy="196" rx="154" ry="66" fill="#312c28"/>
<ellipse cx="200" cy="194" rx="136" ry="55" fill="#26221e"/>
<path d="M64 190 a136 55 0 0 1 272 0" fill="none" stroke="#5c554e" stroke-width="1.6" opacity=".5"/>

<ellipse cx="200" cy="202" rx="124" ry="44" fill="#b28f5b"/>
<ellipse cx="200" cy="197" rx="124" ry="44" fill="url(#koLav)"/>
<path d="M96 192 q52 20 104 2 M104 207 q50 16 96 0" stroke="#c7a670" stroke-width="1.8" fill="none" opacity=".6"/>
<ellipse cx="252" cy="204" rx="20" ry="8" fill="#a87f47" opacity=".3" filter="url(#koBlur)"/>

<!-- sumaklı soğan (arka) -->
<g>
  <path d="M92 172 q24 -9 46 -3" stroke="#f3e6d6" stroke-width="3.8" fill="none" stroke-linecap="round"/>
  <path d="M96 181 q24 -9 46 -2" stroke="#ece0cf" stroke-width="3.2" fill="none" stroke-linecap="round"/>
  <circle cx="110" cy="175" r="1.7" fill="#a32b17"/><circle cx="128" cy="182" r="1.5" fill="#a32b17"/>
  <circle cx="138" cy="174" r="1.4" fill="#a32b17"/>
</g>

<!-- KÖFTELER -->
<g>
  <g transform="rotate(-8 152 172)">
    <ellipse cx="152" cy="180" rx="40" ry="19" fill="#3a1f0d" opacity=".5" filter="url(#koBlur)"/>
    <ellipse cx="152" cy="172" rx="40" ry="19" fill="url(#koMeat)"/>
    <path d="M120 166 q32 -9 64 -1 M118 178 q34 9 68 -1" stroke="#2b1406" stroke-width="3.6" fill="none" opacity=".6" stroke-linecap="round"/>
    <ellipse cx="140" cy="162" rx="17" ry="5" fill="#d29c66" opacity=".45" filter="url(#koBlur)"/>
  </g>
  <g transform="rotate(7 248 170)">
    <ellipse cx="248" cy="178" rx="39" ry="18" fill="#3a1f0d" opacity=".5" filter="url(#koBlur)"/>
    <ellipse cx="248" cy="170" rx="39" ry="18" fill="url(#koMeat)"/>
    <path d="M217 164 q31 -9 62 -1 M215 176 q33 9 66 -1" stroke="#2b1406" stroke-width="3.6" fill="none" opacity=".6" stroke-linecap="round"/>
    <ellipse cx="236" cy="160" rx="16" ry="5" fill="#d29c66" opacity=".45" filter="url(#koBlur)"/>
  </g>
  <g transform="rotate(-4 130 206)">
    <ellipse cx="130" cy="214" rx="40" ry="19" fill="#3a1f0d" opacity=".5" filter="url(#koBlur)"/>
    <ellipse cx="130" cy="206" rx="40" ry="19" fill="url(#koMeat)"/>
    <path d="M98 200 q32 -9 64 -1 M96 212 q34 9 68 -1" stroke="#2b1406" stroke-width="3.6" fill="none" opacity=".6" stroke-linecap="round"/>
    <ellipse cx="118" cy="196" rx="17" ry="5" fill="#d29c66" opacity=".45" filter="url(#koBlur)"/>
  </g>
  <g transform="rotate(4 202 212)">
    <ellipse cx="202" cy="220" rx="40" ry="19" fill="#3a1f0d" opacity=".5" filter="url(#koBlur)"/>
    <ellipse cx="202" cy="212" rx="40" ry="19" fill="url(#koMeat)"/>
    <path d="M170 206 q32 -9 64 -1 M168 218 q34 9 68 -1" stroke="#2b1406" stroke-width="3.6" fill="none" opacity=".6" stroke-linecap="round"/>
    <ellipse cx="190" cy="202" rx="17" ry="5" fill="#d29c66" opacity=".45" filter="url(#koBlur)"/>
  </g>
</g>

<!-- közlenmiş biber & domates -->
<g transform="rotate(-14 300 208)">
  <path d="M272 212 q9 -20 28 -19 q20 1 28 15 q6 11 -6 15 q-15 5 -32 2 q-17 -3 -18 -13 z" fill="url(#koPep)"/>
  <path d="M280 204 q15 -8 34 -2" stroke="#c9e07a" stroke-width="2.4" fill="none" opacity=".55" stroke-linecap="round"/>
  <path d="M284 215 q17 6 36 1" stroke="#20340f" stroke-width="3" fill="none" opacity=".6" stroke-linecap="round"/>
</g>
<g transform="translate(292 238)">
  <circle r="19" fill="url(#koTom)"/>
  <path d="M-16 -4 q16 10 32 -2" stroke="#5c1108" stroke-width="3.2" fill="none" opacity=".5" stroke-linecap="round"/>
  <ellipse cx="-6" cy="-9" rx="6" ry="4" fill="#ff9d72" opacity=".5" filter="url(#koBlur)"/>
</g>
<g fill="#4f8f2e">
  <path d="M258 226 q8 -12 18 -12 q-3 12 -14 16 z"/>
</g>

<g fill="none" stroke="#ffd9a8" stroke-linecap="round" opacity=".15">
  <path d="M164 126 q-10 -18 3 -30 q11 -12 2 -26" stroke-width="3.4"/>
  <path d="M214 120 q11 -15 0 -28 q-10 -12 2 -24" stroke-width="3"/>
</g>
</svg>
