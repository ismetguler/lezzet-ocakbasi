<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300" role="img" aria-label="Adana dürüm — zırhla çekilmiş acılı kıyma kebabı, sumaklı soğanla lavaşa sarılmış">
<defs>
  <radialGradient id="adBg" cx="50%" cy="40%" r="75%">
    <stop offset="0" stop-color="#3f2415"/><stop offset=".55" stop-color="#251810"/><stop offset="1" stop-color="#140f0c"/>
  </radialGradient>
  <radialGradient id="adGlow" cx="50%" cy="50%" r="50%">
    <stop offset="0" stop-color="#ff5f14" stop-opacity=".36"/><stop offset="1" stop-color="#ff5f14" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="adLav" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#9d7440"/><stop offset=".16" stop-color="#e3c692"/><stop offset=".42" stop-color="#f7e8c1"/>
    <stop offset=".70" stop-color="#dcbb82"/><stop offset="1" stop-color="#8d6739"/>
  </linearGradient>
  <linearGradient id="adFoil" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#6f7378"/><stop offset=".2" stop-color="#c8ced4"/><stop offset=".38" stop-color="#8d9399"/>
    <stop offset=".58" stop-color="#e3e8ec"/><stop offset=".78" stop-color="#909599"/><stop offset="1" stop-color="#5f6367"/>
  </linearGradient>
  <radialGradient id="adFace" cx="42%" cy="34%" r="72%">
    <stop offset="0" stop-color="#6d3316"/><stop offset="1" stop-color="#33190c"/>
  </radialGradient>
  <linearGradient id="adKeb" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#d3653a"/><stop offset=".42" stop-color="#a83f1e"/><stop offset="1" stop-color="#5f210d"/>
  </linearGradient>
  <linearGradient id="adPep" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#8cbb45"/><stop offset="1" stop-color="#3c6520"/>
  </linearGradient>
  <filter id="adSoft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="3"/></filter>
  <filter id="adBlur" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="1.2"/></filter>
</defs>

<rect width="400" height="300" fill="url(#adBg)"/>
<ellipse cx="200" cy="160" rx="190" ry="140" fill="url(#adGlow)"/>
<ellipse cx="200" cy="284" rx="150" ry="17" fill="#0d0a08" opacity=".75" filter="url(#adSoft)"/>
<ellipse cx="200" cy="279" rx="96" ry="12" fill="#000" opacity=".55" filter="url(#adSoft)"/>

<!-- yanda şişte adana -->
<g transform="rotate(-7 305 254)">
  <rect x="248" y="254" width="122" height="4" rx="2" fill="#9aa2a8"/>
  <rect x="248" y="254" width="122" height="1.6" rx="1" fill="#e6edf1" opacity=".8"/>
  <path d="M262 254 q6 -16 20 -16 h58 q16 0 20 16 q-6 14 -20 14 h-58 q-15 0 -20 -14 z" fill="url(#adKeb)"/>
  <path d="M268 246 q28 -6 62 -1 M266 258 q30 6 66 0" stroke="#4a1a08" stroke-width="2.6" fill="none" opacity=".55" stroke-linecap="round"/>
  <g fill="#7d2b10" opacity=".55">
    <circle cx="280" cy="250" r="1.7"/><circle cx="296" cy="245" r="1.5"/><circle cx="312" cy="252" r="1.6"/><circle cx="328" cy="247" r="1.4"/>
  </g>
  <ellipse cx="292" cy="243" rx="16" ry="4" fill="#eb8b53" opacity=".4" filter="url(#adBlur)"/>
</g>

<!-- közlenmiş biber -->
<g transform="rotate(-12 90 262)">
  <path d="M58 266 q10 -22 30 -21 q22 1 30 16 q6 12 -6 16 q-16 5 -34 2 q-18 -3 -20 -13 z" fill="url(#adPep)"/>
  <path d="M66 258 q16 -9 38 -2" stroke="#c9e07a" stroke-width="2.4" fill="none" opacity=".55" stroke-linecap="round"/>
  <path d="M72 269 q18 6 38 1" stroke="#20340f" stroke-width="3" fill="none" opacity=".6" stroke-linecap="round"/>
</g>
<!-- sumaklı soğan -->
<g>
  <path d="M120 278 q18 -8 36 -3" stroke="#f3e6d6" stroke-width="3.4" fill="none" stroke-linecap="round"/>
  <path d="M126 270 q20 -9 40 -2" stroke="#ece0cf" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M134 285 q16 -6 32 -2" stroke="#f6ece0" stroke-width="3" fill="none" stroke-linecap="round"/>
  <circle cx="140" cy="273" r="1.7" fill="#a32b17"/><circle cx="154" cy="280" r="1.5" fill="#a32b17"/>
  <circle cx="162" cy="272" r="1.4" fill="#a32b17"/><circle cx="132" cy="282" r="1.3" fill="#a32b17"/>
</g>

<!-- DÜRÜM -->
<g transform="rotate(-6 200 180)">
  <path d="M157 84 L157 276 q0 14 14 14 L229 290 q14 0 14 -14 L243 84 Z" fill="url(#adLav)"/>
  <path d="M162 110 q38 16 76 2" stroke="#b78f57" stroke-width="1.6" fill="none" opacity=".5"/>
  <path d="M160 150 q40 18 82 0" stroke="#b78f57" stroke-width="1.6" fill="none" opacity=".42"/>
  <path d="M186 92 L182 274" stroke="#c9a36c" stroke-width="2" fill="none" opacity=".45"/>
  <path d="M222 92 L226 274" stroke="#8f6c3c" stroke-width="2.4" fill="none" opacity=".4"/>
  <ellipse cx="176" cy="132" rx="9" ry="5" fill="#8d6534" opacity=".35" filter="url(#adBlur)"/>
  <ellipse cx="215" cy="176" rx="11" ry="6" fill="#8d6534" opacity=".3" filter="url(#adBlur)"/>
  <!-- kırmızı yağ sızması -->
  <ellipse cx="196" cy="160" rx="16" ry="8" fill="#c0451e" opacity=".22" filter="url(#adBlur)"/>

  <path d="M155 196 q22 10 44 4 q26 -8 46 3 L245 276 q0 14 -14 14 L171 290 q-14 0 -14 -14 Z" fill="url(#adFoil)"/>
  <path d="M168 206 L164 288 M188 210 L186 290 M210 206 L214 290 M230 202 L234 286"
        stroke="#5c6165" stroke-width="1.3" opacity=".55" fill="none"/>
  <path d="M176 204 L174 288 M200 212 L202 290 M222 204 L226 288"
        stroke="#f2f6f8" stroke-width="1" opacity=".5" fill="none"/>
  <path d="M155 196 q22 10 44 4 q26 -8 46 3" stroke="#eef2f5" stroke-width="2" fill="none" opacity=".7"/>

  <ellipse cx="200" cy="84" rx="43" ry="13.5" fill="url(#adLav)"/>
  <ellipse cx="200" cy="85" rx="35" ry="10" fill="url(#adFace)"/>
  <!-- adana kesitte -->
  <g>
    <path d="M170 86 q4 -9 14 -9 h30 q11 0 14 9 q-5 8 -14 8 h-30 q-10 0 -14 -8 z" fill="url(#adKeb)"/>
    <path d="M176 80 q22 -4 44 0 M174 89 q24 5 48 -1" stroke="#4a1a08" stroke-width="2" fill="none" opacity=".5" stroke-linecap="round"/>
    <g fill="#7d2b10" opacity=".6">
      <circle cx="184" cy="84" r="1.6"/><circle cx="197" cy="81" r="1.4"/><circle cx="208" cy="86" r="1.5"/><circle cx="216" cy="82" r="1.3"/>
    </g>
    <ellipse cx="192" cy="79" rx="12" ry="2.6" fill="#f0a06a" opacity=".45" filter="url(#adBlur)"/>
  </g>
  <path d="M166 82 q10 -10 20 -8 q-6 9 -20 11 z" fill="#f3e6d6" opacity=".9"/>
  <path d="M214 77 q11 -9 21 -6 q-8 9 -21 9 z" fill="#f7ece0" opacity=".85"/>
  <path d="M190 73 q6 -9 14 -9 q-2 8 -10 12 z" fill="#4f8f2e"/>
  <circle cx="180" cy="74" r="2.4" fill="#a32b17"/><circle cx="220" cy="72" r="2.2" fill="#a32b17"/>
  <ellipse cx="200" cy="84" rx="43" ry="13.5" fill="none" stroke="#c6a26b" stroke-width="1.6" opacity=".8"/>
</g>

<g fill="none" stroke="#ffc79a" stroke-linecap="round" opacity=".17">
  <path d="M182 56 q-9 -16 3 -28 q10 -11 2 -24" stroke-width="3.4"/>
  <path d="M212 50 q10 -14 0 -26 q-9 -11 1 -22" stroke-width="3"/>
</g>
</svg>
