<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300" role="img" aria-label="Tavuk şiş servis — ocakta pişmiş marine tavuk şiş, lavaş yatağında közlenmiş domates biber ve sumaklı soğanla">
<defs>
  <radialGradient id="tvBg" cx="50%" cy="38%" r="75%">
    <stop offset="0" stop-color="#3b2517"/><stop offset=".55" stop-color="#241a13"/><stop offset="1" stop-color="#13100d"/>
  </radialGradient>
  <radialGradient id="tvGlow" cx="50%" cy="46%" r="52%">
    <stop offset="0" stop-color="#ff7d1e" stop-opacity=".3"/><stop offset="1" stop-color="#ff7d1e" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="tvLav" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#f7e8c1"/><stop offset=".6" stop-color="#e2c692"/><stop offset="1" stop-color="#b28f5b"/>
  </linearGradient>
  <linearGradient id="tvCube" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#f8d68d"/><stop offset=".45" stop-color="#e0ac4e"/><stop offset="1" stop-color="#9a6a20"/>
  </linearGradient>
  <linearGradient id="tvTom" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#e0512c"/><stop offset="1" stop-color="#8d1e10"/>
  </linearGradient>
  <linearGradient id="tvPep" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#8cbb45"/><stop offset="1" stop-color="#3c6520"/>
  </linearGradient>
  <filter id="tvSoft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="3.5"/></filter>
  <filter id="tvBlur" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="1.3"/></filter>
</defs>

<rect width="400" height="300" fill="url(#tvBg)"/>
<ellipse cx="200" cy="150" rx="190" ry="140" fill="url(#tvGlow)"/>
<ellipse cx="200" cy="256" rx="156" ry="30" fill="#0b0806" opacity=".8" filter="url(#tvSoft)"/>

<ellipse cx="200" cy="200" rx="154" ry="66" fill="#1a1715"/>
<ellipse cx="200" cy="196" rx="154" ry="66" fill="#312c28"/>
<ellipse cx="200" cy="194" rx="136" ry="55" fill="#26221e"/>
<path d="M64 190 a136 55 0 0 1 272 0" fill="none" stroke="#5c554e" stroke-width="1.6" opacity=".5"/>

<!-- lavaş yatağı -->
<ellipse cx="200" cy="200" rx="124" ry="44" fill="#b28f5b"/>
<ellipse cx="200" cy="195" rx="124" ry="44" fill="url(#tvLav)"/>
<path d="M96 190 q52 20 104 2 M104 205 q50 16 96 0" stroke="#c7a670" stroke-width="1.8" fill="none" opacity=".6"/>
<ellipse cx="150" cy="182" rx="18" ry="7" fill="#a87f47" opacity=".35" filter="url(#tvBlur)"/>
<ellipse cx="250" cy="200" rx="20" ry="8" fill="#a87f47" opacity=".3" filter="url(#tvBlur)"/>

<!-- sumaklı soğan -->
<g transform="translate(0 -4)">
  <path d="M96 178 q22 -9 44 -3" stroke="#f3e6d6" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M100 186 q24 -9 46 -2" stroke="#ece0cf" stroke-width="3.4" fill="none" stroke-linecap="round"/>
  <path d="M104 194 q22 -8 42 -2" stroke="#f6ece0" stroke-width="3" fill="none" stroke-linecap="round"/>
  <circle cx="114" cy="181" r="1.8" fill="#a32b17"/><circle cx="130" cy="188" r="1.6" fill="#a32b17"/>
  <circle cx="140" cy="180" r="1.5" fill="#a32b17"/>
</g>

<!-- şişler -->
<g transform="rotate(-6 200 176)">
  <rect x="76" y="182" width="252" height="4.5" rx="2" fill="#8f979d"/>
  <rect x="76" y="182" width="252" height="1.8" rx="1" fill="#e6edf1" opacity=".85"/>
  <g>
    <rect x="112" y="160" width="34" height="34" rx="9" fill="url(#tvCube)"/>
    <rect x="152" y="163" width="33" height="33" rx="9" fill="url(#tvCube)"/>
    <rect x="191" y="159" width="34" height="34" rx="9" fill="url(#tvCube)"/>
    <rect x="231" y="163" width="33" height="33" rx="9" fill="url(#tvCube)"/>
    <rect x="270" y="160" width="33" height="34" rx="9" fill="url(#tvCube)"/>
    <path d="M117 170 h24 M117 182 h24 M157 173 h23 M157 185 h23 M196 169 h24 M196 181 h24 M236 173 h23 M236 185 h23 M275 170 h23 M275 182 h23"
          stroke="#6b400f" stroke-width="3" opacity=".5" stroke-linecap="round"/>
    <path d="M117 165 q11 -4 22 0 M157 168 q10 -4 21 0 M196 164 q11 -4 22 0 M236 168 q10 -4 21 0 M275 165 q10 -4 21 0"
          stroke="#ffe6ab" stroke-width="2.4" fill="none" opacity=".55" stroke-linecap="round"/>
  </g>
</g>

<!-- közlenmiş domates & biber -->
<g transform="translate(300 210)">
  <ellipse cx="0" cy="22" rx="24" ry="7" fill="#000" opacity=".4" filter="url(#tvBlur)"/>
  <circle r="22" fill="url(#tvTom)"/>
  <path d="M-19 -5 q19 11 38 -2" stroke="#5c1108" stroke-width="3.4" fill="none" opacity=".5" stroke-linecap="round"/>
  <ellipse cx="-7" cy="-11" rx="7" ry="4" fill="#ff9d72" opacity=".5" filter="url(#tvBlur)"/>
</g>
<g transform="rotate(-14 108 220)">
  <path d="M80 224 q9 -20 28 -19 q20 1 28 15 q6 11 -6 15 q-15 5 -32 2 q-17 -3 -18 -13 z" fill="url(#tvPep)"/>
  <path d="M88 216 q15 -8 34 -2" stroke="#c9e07a" stroke-width="2.4" fill="none" opacity=".55" stroke-linecap="round"/>
  <path d="M92 227 q17 6 36 1" stroke="#20340f" stroke-width="3" fill="none" opacity=".6" stroke-linecap="round"/>
</g>
<g fill="#4f8f2e">
  <path d="M186 222 q8 -12 18 -12 q-3 12 -14 16 z"/>
  <path d="M202 228 q9 -10 18 -9 q-4 11 -16 14 z" fill="#63a83a"/>
</g>

<g fill="none" stroke="#ffd9a8" stroke-linecap="round" opacity=".15">
  <path d="M170 120 q-10 -18 3 -30 q11 -12 2 -26" stroke-width="3.4"/>
  <path d="M218 114 q11 -15 0 -28 q-10 -12 2 -24" stroke-width="3"/>
</g>
</svg>
