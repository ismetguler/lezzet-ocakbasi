<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300" role="img" aria-label="Adana servis — zırhla çekilmiş acılı kıyma kebabı, lavaş yatağında közlenmiş domates biber ve sumaklı soğanla">
<defs>
  <radialGradient id="asBg" cx="50%" cy="38%" r="75%">
    <stop offset="0" stop-color="#3f2415"/><stop offset=".55" stop-color="#251810"/><stop offset="1" stop-color="#140f0c"/>
  </radialGradient>
  <radialGradient id="asGlow" cx="50%" cy="46%" r="52%">
    <stop offset="0" stop-color="#ff5f14" stop-opacity=".32"/><stop offset="1" stop-color="#ff5f14" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="asLav" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#f7e8c1"/><stop offset=".6" stop-color="#e2c692"/><stop offset="1" stop-color="#b28f5b"/>
  </linearGradient>
  <linearGradient id="asKeb" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#dd7040"/><stop offset=".22" stop-color="#c05427"/><stop offset=".62" stop-color="#a03c1b"/><stop offset="1" stop-color="#571d0b"/>
  </linearGradient>
  <linearGradient id="asPep" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#8cbb45"/><stop offset="1" stop-color="#3c6520"/>
  </linearGradient>
  <linearGradient id="asTom" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#e0512c"/><stop offset="1" stop-color="#8d1e10"/>
  </linearGradient>
  <filter id="asSoft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="3.5"/></filter>
  <filter id="asBlur" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="1.3"/></filter>
</defs>

<rect width="400" height="300" fill="url(#asBg)"/>
<ellipse cx="200" cy="150" rx="190" ry="140" fill="url(#asGlow)"/>
<ellipse cx="200" cy="256" rx="156" ry="30" fill="#0b0806" opacity=".8" filter="url(#asSoft)"/>

<ellipse cx="200" cy="200" rx="154" ry="66" fill="#1a1715"/>
<ellipse cx="200" cy="196" rx="154" ry="66" fill="#312c28"/>
<ellipse cx="200" cy="194" rx="136" ry="55" fill="#26221e"/>
<path d="M64 190 a136 55 0 0 1 272 0" fill="none" stroke="#5c554e" stroke-width="1.6" opacity=".5"/>

<ellipse cx="200" cy="202" rx="124" ry="44" fill="#b28f5b"/>
<ellipse cx="200" cy="197" rx="124" ry="44" fill="url(#asLav)"/>
<path d="M96 192 q52 20 104 2 M104 207 q50 16 96 0" stroke="#c7a670" stroke-width="1.8" fill="none" opacity=".6"/>
<!-- kebabın kırmızı yağı lavaşa işlemiş -->
<ellipse cx="196" cy="204" rx="70" ry="18" fill="#c0451e" opacity=".2" filter="url(#asBlur)"/>

<!-- sumaklı soğan (arka) -->
<g>
  <path d="M92 170 q24 -9 46 -3" stroke="#f3e6d6" stroke-width="3.8" fill="none" stroke-linecap="round"/>
  <path d="M96 179 q24 -9 46 -2" stroke="#ece0cf" stroke-width="3.2" fill="none" stroke-linecap="round"/>
  <circle cx="110" cy="173" r="1.7" fill="#a32b17"/><circle cx="128" cy="180" r="1.5" fill="#a32b17"/>
  <circle cx="138" cy="172" r="1.4" fill="#a32b17"/>
</g>

<!-- ADANA — iki şiş -->
<g transform="rotate(-5 200 178)">
  <rect x="74" y="176" width="256" height="4.5" rx="2" fill="#8f979d"/>
  <rect x="74" y="176" width="256" height="1.8" rx="1" fill="#e6edf1" opacity=".85"/>
  <path d="M112 178 q7 -21 26 -21 h124 q19 0 26 21 q-8 18 -26 18 h-124 q-19 0 -26 -18 z" fill="url(#asKeb)"/>
  <path d="M122 166 q60 -9 128 -1 M120 186 q64 10 134 -1" stroke="#4a1a08" stroke-width="3" fill="none" opacity=".5" stroke-linecap="round"/>
  <path d="M132 176 q56 -6 112 0" stroke="#7c2c10" stroke-width="2.4" fill="none" opacity=".45"/>
  <g fill="#7d2b10" opacity=".55">
    <circle cx="140" cy="172" r="2"/><circle cx="164" cy="166" r="1.7"/><circle cx="188" cy="180" r="1.9"/>
    <circle cx="212" cy="170" r="1.6"/><circle cx="236" cy="182" r="1.8"/><circle cx="256" cy="172" r="1.5"/>
  </g>
  <ellipse cx="176" cy="164" rx="46" ry="5" fill="#f2a06a" opacity=".4" filter="url(#asBlur)"/>
</g>
<g transform="rotate(4 200 216)">
  <rect x="86" y="216" width="234" height="4.5" rx="2" fill="#8f979d"/>
  <rect x="86" y="216" width="234" height="1.8" rx="1" fill="#e6edf1" opacity=".85"/>
  <path d="M118 218 q7 -20 25 -20 h116 q18 0 25 20 q-8 17 -25 17 h-116 q-18 0 -25 -17 z" fill="url(#asKeb)"/>
  <path d="M128 207 q56 -9 120 -1 M126 226 q60 10 126 -1" stroke="#4a1a08" stroke-width="3" fill="none" opacity=".5" stroke-linecap="round"/>
  <g fill="#7d2b10" opacity=".55">
    <circle cx="146" cy="213" r="1.9"/><circle cx="170" cy="222" r="1.6"/><circle cx="196" cy="210" r="1.8"/>
    <circle cx="222" cy="221" r="1.6"/><circle cx="246" cy="212" r="1.5"/>
  </g>
  <ellipse cx="180" cy="206" rx="42" ry="5" fill="#f2a06a" opacity=".38" filter="url(#asBlur)"/>
</g>

<!-- közlenmiş biber & domates -->
<g transform="rotate(-14 306 178)">
  <path d="M278 182 q9 -20 28 -19 q20 1 28 15 q6 11 -6 15 q-15 5 -32 2 q-17 -3 -18 -13 z" fill="url(#asPep)"/>
  <path d="M286 174 q15 -8 34 -2" stroke="#c9e07a" stroke-width="2.4" fill="none" opacity=".55" stroke-linecap="round"/>
  <path d="M290 185 q17 6 36 1" stroke="#20340f" stroke-width="3" fill="none" opacity=".6" stroke-linecap="round"/>
</g>
<g transform="translate(310 240)">
  <circle r="19" fill="url(#asTom)"/>
  <path d="M-16 -4 q16 10 32 -2" stroke="#5c1108" stroke-width="3.2" fill="none" opacity=".5" stroke-linecap="round"/>
  <ellipse cx="-6" cy="-9" rx="6" ry="4" fill="#ff9d72" opacity=".5" filter="url(#asBlur)"/>
</g>
<g fill="#4f8f2e">
  <path d="M104 232 q8 -12 18 -12 q-3 12 -14 16 z"/>
  <path d="M120 238 q9 -10 18 -9 q-4 11 -16 14 z" fill="#63a83a"/>
</g>

<g fill="none" stroke="#ffc79a" stroke-linecap="round" opacity=".16">
  <path d="M164 122 q-10 -18 3 -30 q11 -12 2 -26" stroke-width="3.4"/>
  <path d="M218 116 q11 -15 0 -28 q-10 -12 2 -24" stroke-width="3"/>
</g>
</svg>
