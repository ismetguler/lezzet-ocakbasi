<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300" role="img" aria-label="Kanat servis — közde ızgara çıtır tavuk kanat, lavaş yatağında közlenmiş biber ve sumaklı soğanla">
<defs>
  <radialGradient id="knBg" cx="50%" cy="38%" r="75%">
    <stop offset="0" stop-color="#3b2517"/><stop offset=".55" stop-color="#241a13"/><stop offset="1" stop-color="#13100d"/>
  </radialGradient>
  <radialGradient id="knGlow" cx="50%" cy="46%" r="52%">
    <stop offset="0" stop-color="#ff7d1e" stop-opacity=".3"/><stop offset="1" stop-color="#ff7d1e" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="knLav" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#f7e8c1"/><stop offset=".6" stop-color="#e2c692"/><stop offset="1" stop-color="#b28f5b"/>
  </linearGradient>
  <linearGradient id="knSkin" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#e7a751"/><stop offset=".45" stop-color="#c1762c"/><stop offset="1" stop-color="#7d4413"/>
  </linearGradient>
  <linearGradient id="knPep" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#8cbb45"/><stop offset="1" stop-color="#3c6520"/>
  </linearGradient>
  <linearGradient id="knTom" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#e0512c"/><stop offset="1" stop-color="#8d1e10"/>
  </linearGradient>
  <filter id="knSoft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="3.5"/></filter>
  <filter id="knBlur" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="1.3"/></filter>
</defs>

<rect width="400" height="300" fill="url(#knBg)"/>
<ellipse cx="200" cy="150" rx="190" ry="140" fill="url(#knGlow)"/>
<ellipse cx="200" cy="256" rx="156" ry="30" fill="#0b0806" opacity=".8" filter="url(#knSoft)"/>

<ellipse cx="200" cy="200" rx="154" ry="66" fill="#1a1715"/>
<ellipse cx="200" cy="196" rx="154" ry="66" fill="#312c28"/>
<ellipse cx="200" cy="194" rx="136" ry="55" fill="#26221e"/>
<path d="M64 190 a136 55 0 0 1 272 0" fill="none" stroke="#5c554e" stroke-width="1.6" opacity=".5"/>

<ellipse cx="200" cy="202" rx="124" ry="44" fill="#b28f5b"/>
<ellipse cx="200" cy="197" rx="124" ry="44" fill="url(#knLav)"/>
<path d="M96 192 q52 20 104 2 M104 207 q50 16 96 0" stroke="#c7a670" stroke-width="1.8" fill="none" opacity=".6"/>

<!-- KANATLAR -->
