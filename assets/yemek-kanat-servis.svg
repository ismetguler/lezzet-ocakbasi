    <path d="M242 178 q10 6 20 4 q8 -2 6 -8" stroke="#e9c78f" stroke-width="4" fill="none" stroke-linecap="round" opacity=".9"/>
    <path d="M222 162 q20 -8 40 -2 M220 172 q22 7 44 0" stroke="#3d1c06" stroke-width="3" fill="none" opacity=".55" stroke-linecap="round"/>
