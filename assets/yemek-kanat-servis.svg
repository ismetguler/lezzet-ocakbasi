    <path d="M126 166 q20 -8 40 -2 M124 176 q22 7 44 0" stroke="#3d1c06" stroke-width="3" fill="none" opacity=".55" stroke-linecap="round"/>
    <ellipse cx="136" cy="161" rx="14" ry="4" fill="#ffce87" opacity=".5" filter="url(#knBlur)"/>
  </g>
  <g transform="rotate(10 246 168)">
