  </g>
  <!-- ön sıra -->
  <g transform="rotate(-6 128 202)">
    <path d="M100 200 q8 -18 28 -16 q20 2 24 16 q3 12 -12 15 q-18 4 -32 -2 q-11 -5 -8 -13 z" fill="url(#knSkin)"/>
    <path d="M126 212 q10 6 20 4 q8 -2 6 -8" stroke="#e9c78f" stroke-width="4" fill="none" stroke-linecap="round" opacity=".9"/>
    <path d="M106 196 q20 -8 40 -2 M104 206 q22 7 44 0" stroke="#3d1c06" stroke-width="3" fill="none" opacity=".55" stroke-linecap="round"/>
    <ellipse cx="116" cy="191" rx="14" ry="4" fill="#ffce87" opacity=".5" filter="url(#knBlur)"/>
  </g>
  <g transform="rotate(6 190 208)">
    <path d="M162 206 q8 -18 28 -16 q20 2 24 16 q3 12 -12 15 q-18 4 -32 -2 q-11 -5 -8 -13 z" fill="url(#knSkin)"/>
    <path d="M188 218 q10 6 20 4 q8 -2 6 -8" stroke="#e9c78f" stroke-width="4" fill="none" stroke-linecap="round" opacity=".9"/>
    <path d="M168 202 q20 -8 40 -2 M166 212 q22 7 44 0" stroke="#3d1c06" stroke-width="3" fill="none" opacity=".55" stroke-linecap="round"/>
    <ellipse cx="178" cy="197" rx="14" ry="4" fill="#ffce87" opacity=".5" filter="url(#knBlur)"/>
  </g>
  <g transform="rotate(-10 252 204)">
    <path d="M224 202 q8 -18 28 -16 q20 2 24 16 q3 12 -12 15 q-18 4 -32 -2 q-11 -5 -8 -13 z" fill="url(#knSkin)"/>
    <path d="M250 214 q10 6 20 4 q8 -2 6 -8" stroke="#e9c78f" stroke-width="4" fill="none" stroke-linecap="round" opacity=".9"/>
    <path d="M230 198 q20 -8 40 -2 M228 208 q22 7 44 0" stroke="#3d1c06" stroke-width="3" fill="none" opacity=".55" stroke-linecap="round"/>
    <ellipse cx="240" cy="193" rx="14" ry="4" fill="#ffce87" opacity=".5" filter="url(#knBlur)"/>
  </g>
</g>

<!-- közlenmiş biber & domates -->
<g transform="rotate(-14 306 200)">
  <path d="M278 204 q9 -20 28 -19 q20 1 28 15 q6 11 -6 15 q-15 5 -32 2 q-17 -3 -18 -13 z" fill="url(#knPep)"/>
  <path d="M286 196 q15 -8 34 -2" stroke="#c9e07a" stroke-width="2.4" fill="none" opacity=".55" stroke-linecap="round"/>
  <path d="M290 207 q17 6 36 1" stroke="#20340f" stroke-width="3" fill="none" opacity=".6" stroke-linecap="round"/>
</g>
<g transform="translate(300 232)">
  <circle r="19" fill="url(#knTom)"/>
  <path d="M-16 -4 q16 10 32 -2" stroke="#5c1108" stroke-width="3.2" fill="none" opacity=".5" stroke-linecap="round"/>
  <ellipse cx="-6" cy="-9" rx="6" ry="4" fill="#ff9d72" opacity=".5" filter="url(#knBlur)"/>
</g>
<!-- sumaklı soğan -->
<g>
  <path d="M92 172 q22 -9 42 -3" stroke="#f3e6d6" stroke-width="3.6" fill="none" stroke-linecap="round"/>
  <path d="M96 180 q22 -9 44 -2" stroke="#ece0cf" stroke-width="3" fill="none" stroke-linecap="round"/>
  <circle cx="110" cy="175" r="1.7" fill="#a32b17"/><circle cx="126" cy="181" r="1.5" fill="#a32b17"/>
</g>

<g fill="none" stroke="#ffd9a8" stroke-linecap="round" opacity=".15">
  <path d="M170 128 q-10 -18 3 -30 q11 -12 2 -26" stroke-width="3.4"/>
  <path d="M218 122 q11 -15 0 -28 q-10 -12 2 -24" stroke-width="3"/>
</g>
</svg>
